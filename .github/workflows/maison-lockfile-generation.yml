name: Generate patched lockfile

on:
  push:
    branches:
      - feat/maison-authentic-product-imagery-20261027
    paths:
      - .github/workflows/maison-lockfile-generation.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Prepare patched Next.js package lock
        run: |
          npm install next@16.4.3 eslint-config-next@16.4.3 --package-lock-only --ignore-scripts --no-audit --no-fund
          echo MAISON_LOCK_BEGIN
          base64 -w 76 package-lock.json
          echo MAISON_LOCK_END
